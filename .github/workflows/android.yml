name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        run: |
          sdkmanager --update >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission to scripts
        run: chmod +x gradlew tools/*.sh runtime-bundle/scripts/*.sh runtime-bundle/build_rootfs.sh

      # 需要 python3 跑隐私审计
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 1.2.1 (P6)：多语言资源键位/占位符 parity + 源码硬编码 CJK 扫描
      - name: Run i18n consistency check
        run: bash tools/i18n_check.sh

      # v1.3.1：官网资源查询串须与 versionName 同步
      # （GitHub Pages 静态资源 max-age=600，漏改会出现「新 HTML + 旧 JS」）
      - name: Check website asset version string
        run: |
          APP_VER=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "versionName=$APP_VER"
          for f in website/index.html website/404.html; do
            [ -f "$f" ] || continue
            vers=$(grep -o 'assets/[^"]*?v=[0-9][^"&]*' "$f" | sed 's/.*?v=//' | sort -u)
            if [ -z "$vers" ]; then
              echo "::error file=$f::未发现 ?v= 版本查询串"
              exit 1
            fi
            for v in $vers; do
              if [ "$v" != "$APP_VER" ]; then
                echo "::error file=$f::?v=$v 与 versionName=$APP_VER 不一致"
                exit 1
              fi
            done
          done
          echo "官网资源版本号已同步"

      # v1.3.1：阻断「本机路径/用户名/凭据」随仓库公开
      # （实测踩到 docs/BUILD_RUNBOOK.md 带着开发机 JDK 路径并已公开）
      - name: Run privacy audit
        run: python3 tools/privacy_audit.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      # 运行环境大层不进源码仓库。app/build.gradle.kts 的
      # assets.srcDirs("../../runtime/android-assets") 相对 app/ 解析，落在
      # <repo>/../runtime/android-assets（仓库同级目录）——放错位置时 Gradle
      # 会静默忽略缺失目录，编出没有运行环境的包，故下方另有产物校验。
      - name: Fetch bundled runtime (release)
        if: inputs.variant == 'release'
        run: |
          set -euo pipefail
          RT="$GITHUB_WORKSPACE/../runtime/android-assets"
          mkdir -p "$RT/runtime" "$RT/dsh"
          BASE="https://github.com/WSK-build/DSHBox/releases/download/v1.3.1"
          curl -sSL --retry 3 -o "$RUNNER_TEMP/rt.zip" "$BASE/dshapp-runtime-debian-arm64-0.1.0.zip"
          curl -sSL --retry 3 -o "$RT/dsh/0.1.5-rc.2.tar.zst" "$BASE/0.1.5-rc.2.tar.zst"
          unzip -q "$RUNNER_TEMP/rt.zip" -d "$RUNNER_TEMP/rt"
          for layer in base node android-side; do
            find "$RUNNER_TEMP/rt" -name "$layer.tar*" ! -name '*.sha256' -exec cp {} "$RT/runtime/" \;
            find "$RUNNER_TEMP/rt" -name "$layer.tar*.sha256" -exec cp {} "$RT/runtime/" \;
          done
          find "$RUNNER_TEMP/rt" -name 'runtime-profile.json' -exec cp {} "$RT/runtime/" \;
          ( cd "$RT/dsh" && sha256sum 0.1.5-rc.2.tar.zst > 0.1.5-rc.2.tar.zst.sha256 )
          for layer in base node android-side; do
            ls "$RT/runtime/$layer.tar"* >/dev/null 2>&1 \
              || { echo "::error::$layer layer not found in runtime zip"; find "$RUNNER_TEMP/rt" -maxdepth 3 | head -60; exit 1; }
          done
          test -f "$RT/runtime/runtime-profile.json" \
            || { echo "::error::runtime-profile.json not found"; find "$RUNNER_TEMP/rt" -maxdepth 3 | head -60; exit 1; }
          echo "=== resolved assets dir: $RT ===" && ls -lh "$RT/runtime" "$RT/dsh"

      - name: Assemble APK
        run: ./gradlew assemble${{ inputs.variant == 'release' && 'Release' || 'Debug' }} --stacktrace

      - name: Verify APK embeds runtime and DSH (release)
        if: inputs.variant == 'release'
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -Z1 "$APK" > "$RUNNER_TEMP/apk_entries.txt"
          for pat in \
            'assets/runtime/base.tar' \
            'assets/runtime/node.tar' \
            'assets/runtime/android-side.tar' \
            'assets/runtime/runtime-profile.json' \
            'assets/dsh/0.1.5-rc.2.tar.zst'; do
            grep -qF "$pat" "$RUNNER_TEMP/apk_entries.txt" \
              || { echo "::error::$pat missing from APK (assets not embedded)"; exit 1; }
          done
          echo "APK size: $(du -h "$APK" | cut -f1)"
          echo "runtime entries: $(grep -c 'assets/runtime/' "$RUNNER_TEMP/apk_entries.txt")"
          echo "dsh entries: $(grep -c 'assets/dsh/' "$RUNNER_TEMP/apk_entries.txt")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dshapp-${{ inputs.variant || 'debug' }}-apk
          path: app/build/outputs/apk/${{ inputs.variant || 'debug' }}/app-${{ inputs.variant || 'debug' }}.apk
