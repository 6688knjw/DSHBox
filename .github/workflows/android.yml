name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        run: |
          sdkmanager --update >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission to scripts
        run: chmod +x gradlew tools/*.sh runtime-bundle/scripts/*.sh runtime-bundle/build_rootfs.sh

      # 需要 python3 跑隐私审计
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 1.2.1 (P6)：多语言资源键位/占位符 parity + 源码硬编码 CJK 扫描
      - name: Run i18n consistency check
        run: bash tools/i18n_check.sh

      # v1.3.1：官网资源查询串须与 versionName 同步
      # （GitHub Pages 静态资源 max-age=600，漏改会出现「新 HTML + 旧 JS」）
      - name: Check website asset version string
        run: |
          APP_VER=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "versionName=$APP_VER"
          for f in website/index.html website/404.html; do
            [ -f "$f" ] || continue
            vers=$(grep -o 'assets/[^"]*?v=[0-9][^"&]*' "$f" | sed 's/.*?v=//' | sort -u)
            if [ -z "$vers" ]; then
              echo "::error file=$f::未发现 ?v= 版本查询串"
              exit 1
            fi
            for v in $vers; do
              if [ "$v" != "$APP_VER" ]; then
                echo "::error file=$f::?v=$v 与 versionName=$APP_VER 不一致"
                exit 1
              fi
            done
          done
          echo "官网资源版本号已同步"

      # v1.3.1：阻断「本机路径/用户名/凭据」随仓库公开
      # （实测踩到 docs/BUILD_RUNBOOK.md 带着开发机 JDK 路径并已公开）
      - name: Run privacy audit
        run: python3 tools/privacy_audit.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      # 运行环境大层不进源码仓库（app/build.gradle.kts 引用 ../../runtime/android-assets）。
      # release 变体从上游 v1.3.1 Release 取回三层与 DSH 层，组装进 assets，避免提交 190MB 二进制。
      - name: Fetch bundled runtime (release)
        if: inputs.variant == 'release'
        run: |
          set -euo pipefail
          mkdir -p runtime/android-assets/runtime runtime/android-assets/dsh
          BASE="https://github.com/WSK-build/DSHBox/releases/download/v1.3.1"
          curl -sSL --retry 3 -o /tmp/rt.zip "$BASE/dshapp-runtime-debian-arm64-0.1.0.zip"
          curl -sSL --retry 3 -o runtime/android-assets/dsh/0.1.5-rc.2.tar.zst "$BASE/0.1.5-rc.2.tar.zst"
          unzip -q /tmp/rt.zip -d /tmp/rt
          for layer in base node android-side; do
            find /tmp/rt -name "$layer.tar*" ! -name '*.sha256' -exec cp {} runtime/android-assets/runtime/ \;
            find /tmp/rt -name "$layer.tar*.sha256" -exec cp {} runtime/android-assets/runtime/ \;
          done
          find /tmp/rt -name 'runtime-profile.json' -exec cp {} runtime/android-assets/runtime/ \;
          ( cd runtime/android-assets/dsh && sha256sum 0.1.5-rc.2.tar.zst > 0.1.5-rc.2.tar.zst.sha256 )
          for layer in base node android-side; do
            ls runtime/android-assets/runtime/$layer.tar* >/dev/null 2>&1 \
              || { echo "::error::$layer layer not found in runtime zip"; find /tmp/rt -maxdepth 3 | head -60; exit 1; }
          done
          test -f runtime/android-assets/runtime/runtime-profile.json \
            || { echo "::error::runtime-profile.json not found"; find /tmp/rt -maxdepth 3 | head -60; exit 1; }
          echo "=== runtime ===" && ls -lh runtime/android-assets/runtime
          echo "=== dsh ===" && ls -lh runtime/android-assets/dsh

      - name: Assemble APK
        run: ./gradlew assemble${{ inputs.variant == 'release' && 'Release' || 'Debug' }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dshapp-${{ inputs.variant || 'debug' }}-apk
          path: app/build/outputs/apk/${{ inputs.variant || 'debug' }}/app-${{ inputs.variant || 'debug' }}.apk
